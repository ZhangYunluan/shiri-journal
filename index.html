<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#141715" />
    <meta
      name="description"
      content="拾日：记录生活，回看自己。已保存片刻按明确的好友授权同步，私人日记与复盘保留本机。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob:; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>拾日 · 私人生活日志</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="life.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main id="main" tabindex="-1">
        <div class="initial-loading">正在打开你的本地生活日志…</div>
      </main>
      <footer class="page-footer">
        <span>日子有迹，生活有序。</span><a href="install.html">安装到手机 ↗</a><span>你的生活，只属于你。</span>
      </footer>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="手机主导航"></nav>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="reminder-banner" id="reminder-banner" hidden></div>
    <dialog id="editor-dialog" aria-labelledby="dialog-title"></dialog>
    <dialog id="import-dialog" aria-labelledby="import-title"></dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title"></dialog>
    <dialog id="photo-onboarding-dialog" aria-labelledby="photo-guide-title"></dialog>
    <dialog id="collector-scan-dialog" aria-labelledby="collector-scan-title"></dialog>
    <input
      id="photo-input"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
      multiple
      hidden
    />
    <input id="backup-input" type="file" accept=".zip,application/zip" hidden />
    <script type="module" src="life-app.mjs"></script>
  </body>
</html>
