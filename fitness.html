<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="记录训练和恢复，读懂近期趋势，知道下一步怎么做。">
  <title>练记 · 健身日常</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='oklch(0.489%200.19%2028.3)'/%3E%3Cpath d='M9 22h5v9H9zm8-13h5v22h-5zm8 7h5v15h-5z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#today" aria-label="练记首页">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">练记</span><span class="brand-tagline">TRAINING LOG</span>
      </a>
      <p class="topbar-caption">记录训练，也照顾恢复</p>
      <span class="local-badge"><span class="local-dot" aria-hidden="true"></span>数据只保存在本机</span>
    </header>

    <div class="app-layout">
      <nav class="side-nav" aria-label="主导航">
        <button class="nav-item is-active" type="button" data-view="today" aria-current="page">
          <span class="nav-icon" aria-hidden="true">◷</span><span>今天</span>
        </button>
        <button class="nav-item" type="button" data-view="log">
          <span class="nav-icon" aria-hidden="true">＋</span><span>记录</span>
        </button>
        <button class="nav-item" type="button" data-view="trends">
          <span class="nav-icon" aria-hidden="true">▥</span><span>趋势</span>
        </button>
        <div class="nav-footnote">每一点记录<br>都能帮你找到方向</div>
      </nav>

      <main id="app-main" tabindex="-1">
        <section class="view" id="view-today" aria-labelledby="page-title-today"></section>
        <section class="view" id="view-log" aria-labelledby="page-title-log" hidden></section>
        <section class="view" id="view-trends" aria-labelledby="page-title-trends" hidden></section>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item is-active" type="button" data-view="today" aria-current="page"><span aria-hidden="true">◷</span><span>今天</span></button>
      <button class="nav-item" type="button" data-view="log"><span aria-hidden="true">＋</span><span>记录</span></button>
      <button class="nav-item" type="button" data-view="trends"><span aria-hidden="true">▥</span><span>趋势</span></button>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
